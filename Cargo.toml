[package]
name = "spaghetti"
version = "2.6.1"
edition = "2024"
description = "Spaghetti-code and architectural-smell detector for Python projects, in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lvalverdeb/spaghetti-rs"
homepage = "https://github.com/lvalverdeb/spaghetti-rs"
documentation = "https://github.com/lvalverdeb/spaghetti-rs#readme"
keywords = ["static-analysis", "linter", "python", "code-quality"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Luis Valverde"]

[[bin]]
name = "spaghetti"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
indexmap = { version = "2.14.0", features = ["serde"] }
rayon = "1.12.0"
regex = "1.13.1"
rustpython-ast = { version = "0.4.0", features = ["unparse", "visitor"] }
rustpython-parser = { version = "0.4.0", features = ["full-lexer"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
similar = "3.1.1"
toml = "1.1.3"
walkdir = "2.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
proptest = "1.12.0"
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
